name: Release

# Manual: builds, tests and signs the version on main, then publishes it as a GitHub Release
# tagged v<versionName>. Fails if that release already exists.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papermill-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'jdkruzr/AragonitePapermill' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$version"
          test -f "docs/releases/$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists." >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'

      - name: Test and lint release variant
        run: ./gradlew --no-daemon --no-configuration-cache :app:testReleaseUnitTest :app:lintRelease

      - name: Restore release signing configuration
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: python
        run: |
          import base64, os, pathlib
          os.umask(0o077)
          names = ('RELEASE_KEYSTORE_BASE64', 'RELEASE_KEYSTORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Release signing secrets are incomplete.')
          keystore = pathlib.Path(os.environ['RUNNER_TEMP']) / 'papermill-release.p12'
          keystore.write_bytes(base64.b64decode(os.environ['RELEASE_KEYSTORE_BASE64'], validate=True))
          config = pathlib.Path.home() / '.local/share/aragonite-papermill/signing/release.properties'
          config.parent.mkdir(parents=True, exist_ok=True)
          # Java Properties.load(InputStream) expects Latin-1 with Unicode escapes.
          def escape(value):
              out = ''
              for char in value:
                  if char in '\\ =:#!': out += '\\' + char
                  elif char == '\n': out += '\\n'
                  elif char == '\r': out += '\\r'
                  elif char == '\t': out += '\\t'
                  elif not 32 <= ord(char) <= 126:
                      raw = char.encode('utf-16-be')
                      out += ''.join('\\u' + raw[i:i+2].hex() for i in range(0, len(raw), 2))
                  else: out += char
              return out
          values = {'storeFile': str(keystore), 'storePassword': os.environ['RELEASE_KEYSTORE_PASSWORD'],
                    'keyAlias': os.environ['RELEASE_KEY_ALIAS'], 'keyPassword': os.environ['RELEASE_KEY_PASSWORD']}
          config.write_text(''.join(key + '=' + escape(value) + '\n' for key, value in values.items()), encoding='ascii')

      - name: Build signed release APK
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease

      - name: Verify signing identity and package artifact
        env:
          EXPECTED_CERT_SHA256: 1cc79f188ab13584dece402d1b7259cf56cab5e998658198e7b447895ae79298
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/papermill-certificate.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/papermill-certificate.txt")
          test "$actual" = "$EXPECTED_CERT_SHA256"
          mkdir -p dist
          cp "$apk" "dist/Papermill-$VERSION.apk"
          cp "$RUNNER_TEMP/papermill-certificate.txt" dist/signing-certificate.txt
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit.txt
          (cd dist && sha256sum "Papermill-$VERSION.apk" > SHA256SUMS)

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/papermill-release.p12"
          rm -f "$HOME/.local/share/aragonite-papermill/signing/release.properties"

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: papermill-release-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: papermill-checks-${{ github.run_number }}
          path: |
            app/build/test-results/testReleaseUnitTest/TEST-*.xml
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "dist/Papermill-$VERSION.apk" dist/SHA256SUMS dist/signing-certificate.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Papermill $VERSION" --notes-file "docs/releases/$VERSION.md"
